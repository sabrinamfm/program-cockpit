<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Program Cockpit</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="container">
        <header>
            <h1 id="program-name"></h1>

            <div class="snapshot-selector-container">
                <label for="snapshot-selector">Operational Snapshot</label>
                <select id="snapshot-selector"></select>
                <span id="snapshot-note"></span>
            </div>

            <div class="tab-navigation">

                <button class="tab-button active" data-tab="overview">
                    Overview
                </button>

                <button class="tab-button" data-tab="delivery">
                    Delivery
                </button>

                <button class="tab-button" data-tab="operations">
                    Operations
                </button>

                <button class="tab-button" data-tab="governance">
                    Governance
                </button>
            </div>
        </header>
        <main>
            <div id="tab-overview" class="tab-content active">
                <section class="summary-layout">
                    <div class="summary-main">
                        <div class="summary-card">
                            <h2>Executive Summary</h2>
                            <p id="executive-summary"></p>

                            <div class="summary-column">
                                <h3 class="summary-title">
                                    Highlights
                                </h3>
                                <ul id="highlights-list"></ul>

                                <h3 class="summary-title">
                                    Lowlights
                                </h3>
                                <ul id="lowlights-list"></ul>
                            </div>
                        
                            <div class="summary-grid">
                                <div>
                                    <span class="label">Status</span>
                                    <span id="status-class"></span>
                                </div>
                                <div>
                                    <span class="label">Target Launch</span>
                                    <span id="target-launch"></span>
                                </div>
                                <div>
                                    <span class="label">Last Updated</span>
                                    <span id="last-updated"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <aside class="summary-sidebar">
                        <div id="okr-container">
                            <div class="related-okrs">
                                <div class="okr-reference-list"></div>
                            </div>
                        </div>
                    </aside>
                </section>

                <section class="health-strip">
                    <div class="health-metric">
                        <span class="metric-label"></span>
                        <span class="metric-value"></span>
                    </div>

                    <div class="health-metric">
                        <span class="metric-label"></span>
                        <span class="metric-value"></span>
                    </div>

                    <div class="health-metric">
                        <span class="metric-label"></span>
                        <span class="metric-value"></span>
                    </div>

                    <div class="health-metric">
                        <span class="metric-label"></span>
                        <span class="metric-value"></span>
                    </div>
                </section>

                <section class="panel panel-full-width">
                    <h2>Attention Queue</h2>
                    <div id="attention-container" class="attention-grid"></div>
                </section>
            </div>

            <div id="tab-delivery" class="tab-content">
                <section class="panel panel-full-width">
                    <h2 id="milestones-title"></h2>
                    <div id="milestones-container"></div>
                </section>

                <section class="panel">
                    <h2 id="features-title"></h2>
                    <div id="features-container"></div>
                </section>
            </div>

            <div id="tab-operations" class="tab-content">
                <section class="panel">
                    <h2 id="risks-title"></h2>
                    <div id="risks-container"></div>
                </section>

                <section class="panel panel-full-width">
                    <h2>Program Dependencies</h2>
                    <div id="dependencies-container"></div>
                </section>

                <section class="section">
                    <h2> Operational Attention Queue</h2>
                    <div id="operations-attention-container"></div>
                </section>
            </div>

            <div id="tab-governance" class="tab-content">
                <section class="panel panel-full-width">
                    <h2 id="decisions-title"></h2>
                    <div id="decisions-container"></div>
                </section>

                <section class="panel panel-full-width governance-panel">
                    <h2>Governance Warnings</h2>
                    <div id="governance-warnings-container"></div>
                </section>
            </div>
        </main>

        <div id="mitigation-modal" class="modal hidden" aria-hidden="true">
            <div class="modal-backdrop" onclick="closeMitigationModal()"></div>
            <div class="modal-content" role="dialog" aria-modal="true">
                <div class="modal-header">
                    <h3 class="modal-title"></h3>
                    <button class="modal-close" onclick="closeMitigationModal()" aria-label="Close">&times;</button>
                </div>
                <div class="modal-body"></div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>

    <script src="js/schema/risk-schema.js"></script>
    <script src="js/schema/decision-schema.js"></script>
    <script src="js/schema/milestone-schema.js"></script>
    <script src="js/schema/dependency-schema.js"></script>
    <script src="js/schema/attention-schema.js"></script>
    <script src="js/schema/feature-schema.js"></script>

    <script src="js/engine/tab-engine.js"></script>
    <script src="js/engine/validation-engine.js"></script>
    <script src="js/engine/risk-engine.js"></script>
    <script src="js/engine/governance-engine.js"></script>
    <script src="js/engine/snapshot-engine.js"></script>
    <script src="js/engine/relationship-engine.js"></script>

    <script src="js/renderers/header-renderer.js"></script>
    <script src="js/renderers/summary-renderer.js"></script>
    <script src="js/renderers/milestone-renderer.js"></script>
    <script src="js/renderers/feature-renderer.js"></script>
    <script src="js/renderers/risk-renderer.js"></script>
    <script src="js/renderers/dependency-renderer.js"></script>
    <script src="js/renderers/decision-renderer.js"></script>
    <script src="js/renderers/attention-renderer.js"></script>
    <script src="js/renderers/governance-renderer.js"></script>
    <script src="js/renderers/okr-renderer.js"></script>

    <script src="js/app.js"></script>
</body>
</html>
